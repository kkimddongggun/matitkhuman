<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>맛있쿠만 - 경희대 국제캠 맛집 지도</title>
    <style>
        * { box-sizing: border-box; }
        body { margin: 0; padding: 0; font-family: 'Malgun Gothic', 'Pretendard', sans-serif; overflow: hidden; }
        #map { width: 100vw; height: 100vh; }

        /* 좌측 등록 패널 */
        .control-panel {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 1000;
            background: white;
            padding: 20px;
            border-radius: 14px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.15);
            width: 320px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }
        .control-panel h3 { margin: 0 0 14px 0; color: #9E1B32; font-size: 19px; display: flex; align-items: center; gap: 6px; }
        .control-panel input, .control-panel select {
            width: 100%;
            padding: 10px 12px;
            margin-bottom: 8px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            transition: border-color 0.2s;
        }
        .control-panel input:focus, .control-panel select:focus {
            border-color: #9E1B32;
        }
        .control-panel button {
            width: 100%;
            padding: 11px;
            background-color: #9E1B32;
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            margin-bottom: 8px;
            transition: background-color 0.2s;
        }
        .control-panel button:hover { background-color: #7d1527; }
        .btn-sub { background-color: #03C75A !important; }
        .btn-sub:hover { background-color: #02a94d !important; }
        .guide-text { font-size: 11px; color: #777; margin-top: 4px; line-height: 1.4; }

        /* 상단 카테고리 필터 바 */
        .category-filter-bar {
            position: absolute;
            top: 20px;
            left: 360px;
            z-index: 1000;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            background: rgba(255, 255, 255, 0.95);
            padding: 8px 12px;
            border-radius: 30px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.12);
            backdrop-filter: blur(4px);
        }
        .filter-btn {
            border: 1px solid #e0e0e0;
            background: white;
            color: #444;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .filter-btn:hover { background: #f5f5f5; border-color: #bbb; }
        .filter-btn.active {
            background-color: #9E1B32;
            color: white;
            border-color: #9E1B32;
            box-shadow: 0 2px 6px rgba(158, 27, 50, 0.3);
        }

        /* 인포윈도우 스타일 */
        .info-card {
            padding: 16px;
            width: 310px;
            max-height: 480px;
            overflow-y: auto;
            font-size: 13px;
            line-height: 1.5;
            color: #333;
        }
        .info-card h4 {
            margin: 0 0 4px 0;
            font-size: 17px;
            color: #9E1B32;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .info-card .category-badge {
            font-size: 11px;
            background: #f1f3f5;
            color: #495057;
            padding: 2px 7px;
            border-radius: 10px;
            font-weight: normal;
        }
        .info-card .meta-row { margin-bottom: 6px; color: #555; }
        .info-card .rating-summary {
            background: #fff8e1;
            padding: 6px 10px;
            border-radius: 8px;
            font-weight: bold;
            color: #e65100;
            margin: 8px 0;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .info-card hr {
            border: 0;
            border-top: 1px solid #eee;
            margin: 12px 0;
        }

        /* 리뷰 섹션 */
        .reviews-container {
            max-height: 150px;
            overflow-y: auto;
            margin-bottom: 12px;
            padding-right: 4px;
        }
        .review-item {
            background: #fdfdfd;
            border: 1px solid #f0f0f0;
            border-radius: 6px;
            padding: 8px 10px;
            margin-bottom: 6px;
            font-size: 12px;
        }
        .review-item .review-top {
            display: flex;
            justify-content: space-between;
            color: #ff9800;
            font-size: 11px;
            margin-bottom: 3px;
        }
        .review-item .review-date { color: #999; font-size: 10px; }
        .review-item .review-comment { color: #333; word-break: break-all; }

        /* 리뷰 입력 폼 */
        .review-form {
            display: flex;
            flex-direction: column;
            gap: 6px;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
        }
        .review-form .form-row {
            display: flex;
            gap: 6px;
        }
        .review-form select {
            width: 90px;
            padding: 6px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            background: white;
        }
        .review-form input {
            flex: 1;
            padding: 6px 8px;
            font-size: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        .review-form button {
            background: #9E1B32;
            color: white;
            border: none;
            padding: 7px;
            border-radius: 6px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
        }
        .review-form button:hover { background: #7d1527; }
    </style>

    <!-- 1. 네이버 지도 API + Geocoder 서브모듈 -->
    <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=l8sy9w57mc&submodules=geocoder"></script>
    <!-- 2. Supabase JS 클라이언트 SDK CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- 좌측 등록 패널 -->
    <div class="control-panel">
        <h3>🍽️ 맛있쿠만 핀 추가</h3>
        
        <!-- 1. 네이버 지도 링크로 자동 추출 -->
        <input type="text" id="naverLink" placeholder="네이버 지도 링크 (https://naver.me/...)">
        <button class="btn-sub" onclick="fetchFromNaverLink()">1. 링크에서 가게 정보 불러오기</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 12px 0;">

        <!-- 2. 불러온 정보 확인 및 카테고리/메뉴 입력 -->
        <input type="text" id="placeName" placeholder="맛집 이름 *">
        <input type="text" id="placeAddress" placeholder="도로명 주소 *">
        
        <select id="placeCategory">
            <option value="한식">🍚 한식</option>
            <option value="중식">🥟 중식</option>
            <option value="일식">🍣 일식</option>
            <option value="양식">🍝 양식</option>
            <option value="카페/디저트">☕ 카페 / 디저트</option>
            <option value="주점/술집">🍺 주점 / 술집</option>
            <option value="패스트푸드">🍔 패스트푸드 / 분식</option>
            <option value="기타" selected>🍴 기타</option>
        </select>

        <input type="text" id="menuInfo" placeholder="추천 메뉴 / 웨이팅 팁 (선택)">
        <button onclick="saveRestaurantAndPin()">2. 맛집 핀 등록하기</button>

        <div class="guide-text">
            💡 네이버 지도 앱/웹에서 <b>[공유] → [URL 복사]</b>한 링크를 넣고 1번 버튼을 누르면 이름과 주소가 자동으로 채워집니다.
        </div>
    </div>

    <!-- 상단 카테고리 필터 바 -->
    <div class="category-filter-bar">
        <button class="filter-btn active" onclick="filterCategory('전체')">전체보기</button>
        <button class="filter-btn" onclick="filterCategory('한식')">🍚 한식</button>
        <button class="filter-btn" onclick="filterCategory('중식')">🥟 중식</button>
        <button class="filter-btn" onclick="filterCategory('일식')">🍣 일식</button>
        <button class="filter-btn" onclick="filterCategory('양식')">🍝 양식</button>
        <button class="filter-btn" onclick="filterCategory('카페/디저트')">☕ 카페/디저트</button>
        <button class="filter-btn" onclick="filterCategory('주점/술집')">🍺 술집</button>
        <button class="filter-btn" onclick="filterCategory('패스트푸드')">🍔 분식/패스트푸드</button>
        <button class="filter-btn" onclick="filterCategory('기타')">🍴 기타</button>
    </div>

    <!-- 네이버 지도 영역 -->
    <div id="map"></div>

    <script>
        // ==========================================
        // ⚙️ 1. Supabase 연동 설정
        // ==========================================
        const SUPABASE_URL = 'https://nvcpdziimebnrpzajbdf.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_2bBWoHmzoDGlo9KIXMBjLw_nOl2M7mx';
        
        let supabaseClient = null;
        if (window.supabase && SUPABASE_ANON_KEY && !SUPABASE_ANON_KEY.includes('여기에')) {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        }

        // ==========================================
        // 🗺️ 2. 네이버 지도 초기화 (경희대 국제캠퍼스 정문)
        // ==========================================
        const KYUNGHEE_GLOBAL_GATE = new naver.maps.LatLng(37.2430, 127.0811);
        const map = new naver.maps.Map('map', {
            center: KYUNGHEE_GLOBAL_GATE,
            zoom: 16
        });

        let markersList = [];
        let fetchedDescription = "";
        let currentOpenInfoWindow = null;

        // 페이지 로드 시 기존 등록된 맛집들 불러오기
        window.addEventListener('DOMContentLoaded', () => {
            loadRestaurants();
        });

        // ==========================================
        // 📥 3. 네이버 링크 파싱 (/api/parse)
        // ==========================================
        async function fetchFromNaverLink() {
            const link = document.getElementById('naverLink').value.trim();
            if (!link) {
                alert('네이버 지도 공유 링크를 먼저 붙여넣어 주세요!');
                return;
            }

            try {
                const response = await fetch(`/api/parse?url=${encodeURIComponent(link)}`);
                const data = await response.json();

                if (!data.success) {
                    alert(data.message);
                    return;
                }

                document.getElementById('placeName').value = data.name || '';
                document.getElementById('placeAddress').value = data.address || '';
                fetchedDescription = data.description || '';

                if (!data.address) {
                    alert('가게 이름은 불러왔지만 주소가 자동 추출되지 않았습니다. 주소를 직접 입력해 주세요.');
                }
            } catch (error) {
                alert('서버와 통신할 수 없습니다. 로컬 터미널에서 python server.py가 실행 중인지 확인해 주세요.');
            }
        }

        // ==========================================
        // 🛡️ 4. 스키마 자동 적응형 Supabase INSERT 헬퍼
        // (테이블에 없는 컬럼 에러 발생 시 자동 제외 후 즉시 재시도)
        // ==========================================
        async function insertWithSchemaFallback(table, initialPayload) {
            if (!supabaseClient) return { data: null, error: new Error('Supabase 미연결') };

            let payload = { ...initialPayload };
            for (let attempt = 0; attempt < 6; attempt++) {
                try {
                    const { data, error } = await supabaseClient
                        .from(table)
                        .insert([payload])
                        .select();

                    if (!error) {
                        return { data, error: null };
                    }

                    // 스키마 캐시 미발견 컬럼 자동 감지 ("Could not find the 'xyz' column of '...' in the schema cache")
                    const colMatch = error.message && error.message.match(/Could not find the '([^']+)' column/i);
                    if (colMatch && colMatch[1]) {
                        const missingCol = colMatch[1];
                        console.warn(`[스키마 자동 보정] '${table}' 테이블에 '${missingCol}' 컬럼이 없어 제외 후 자동 재시도합니다.`);
                        delete payload[missingCol];
                        continue;
                    }

                    return { data: null, error };
                } catch (e) {
                    return { data: null, error: e };
                }
            }
            return { data: null, error: new Error('재시도 한도 초과') };
        }

        // ==========================================
        // 💾 5. 맛집 저장 & 핀 꽂기 (Supabase + LocalStorage 이중 영구 보관)
        // ==========================================
        function saveRestaurantAndPin() {
            const name = document.getElementById('placeName').value.trim();
            const address = document.getElementById('placeAddress').value.trim();
            const category = document.getElementById('placeCategory').value;
            const menu = document.getElementById('menuInfo').value.trim();
            const link = document.getElementById('naverLink').value.trim();

            if (!name || !address) {
                alert('맛집 이름과 도로명 주소는 필수 입력값입니다!');
                return;
            }

            naver.maps.Service.geocode({ query: address }, async function(status, response) {
                if (status !== naver.maps.Service.Status.OK || response.v2.addresses.length === 0) {
                    alert('주소를 좌표로 변환하지 못했습니다. 도로명 주소를 정확히 입력해 주세요.');
                    return;
                }

                const result = response.v2.addresses[0];
                const lat = parseFloat(result.y);
                const lng = parseFloat(result.x);

                const newRestaurant = {
                    name: name,
                    address: address,
                    category: category,
                    menu: menu,
                    naver_link: link,
                    lat: lat,
                    lng: lng
                };

                let savedId = null;

                // 1) Supabase INSERT 시도 (스키마 자동 적응)
                if (supabaseClient) {
                    const res = await insertWithSchemaFallback('restaurants', newRestaurant);
                    if (res.data && res.data.length > 0) {
                        savedId = res.data[0].id;
                        console.log('Supabase 저장 성공:', savedId);
                    } else if (res.error) {
                        console.warn('Supabase 저장 경고 (로컬 스토리지에 영구 보관):', res.error.message);
                    }
                }

                // 2) 로컬 스토리지에 이중 영구 보관 (새로고침해도 영구 유지)
                newRestaurant.id = savedId || ('loc_' + Date.now());
                saveRestaurantToLocalStorage(newRestaurant);

                // 3) 지도에 핀 꽂기
                addRestaurantMarker(newRestaurant, true);

                // 폼 초기화
                document.getElementById('naverLink').value = '';
                document.getElementById('placeName').value = '';
                document.getElementById('placeAddress').value = '';
                document.getElementById('menuInfo').value = '';
                fetchedDescription = '';
                alert(`'${name}' 맛집이 등록되었습니다! 🎉`);
            });
        }

        // ==========================================
        // 🔄 6. 맛집 목록 불러오기 (Supabase + LocalStorage 병합)
        // ==========================================
        async function loadRestaurants() {
            let combined = [];
            const loadedKeys = new Set();

            // 1) Supabase에서 조회
            if (supabaseClient) {
                try {
                    const { data, error } = await supabaseClient
                        .from('restaurants')
                        .select('*')
                        .order('id', { ascending: false });

                    if (!error && data && data.length > 0) {
                        data.forEach(item => {
                            const key = `${item.name}_${item.address}`;
                            if (!loadedKeys.has(key)) {
                                loadedKeys.add(key);
                                combined.push(item);
                            }
                        });
                    }
                } catch (e) {
                    console.warn('Supabase 로드 건너뜀:', e);
                }
            }

            // 2) LocalStorage 데이터 병합
            const localData = getRestaurantsFromLocalStorage();
            localData.forEach(item => {
                const key = `${item.name}_${item.address}`;
                if (!loadedKeys.has(key)) {
                    loadedKeys.add(key);
                    combined.push(item);
                }
            });

            // 마커 일괄 생성
            combined.forEach(item => {
                addRestaurantMarker(item, false);
            });
        }

        // ==========================================
        // 📍 7. 지도 마커 및 인포윈도우 생성
        // ==========================================
        function addRestaurantMarker(item, shouldOpen = false) {
            const coords = new naver.maps.LatLng(item.lat, item.lng);

            const marker = new naver.maps.Marker({
                position: coords,
                map: map,
                title: item.name
            });

            const infoWindow = new naver.maps.InfoWindow({
                content: generateInfoWindowHtml(item)
            });

            const markerObj = {
                id: item.id,
                category: item.category || '기타',
                marker: marker,
                infoWindow: infoWindow,
                data: item
            };
            markersList.push(markerObj);

            naver.maps.Event.addListener(marker, 'click', function() {
                if (currentOpenInfoWindow && currentOpenInfoWindow.getMap()) {
                    currentOpenInfoWindow.close();
                }
                infoWindow.open(map, marker);
                currentOpenInfoWindow = infoWindow;
                map.panTo(coords);
                loadReviewsForRestaurant(item.id);
            });

            if (shouldOpen) {
                if (currentOpenInfoWindow && currentOpenInfoWindow.getMap()) {
                    currentOpenInfoWindow.close();
                }
                infoWindow.open(map, marker);
                currentOpenInfoWindow = infoWindow;
                map.panTo(coords);
                loadReviewsForRestaurant(item.id);
            }
        }

        // ==========================================
        // 🪟 8. 인포윈도우 HTML 템플릿
        // ==========================================
        function generateInfoWindowHtml(item) {
            const linkHtml = item.naver_link 
                ? `<div style="margin-top:6px;"><a href="${item.naver_link}" target="_blank" style="color:#03C75A; font-weight:bold; text-decoration:none; font-size:12px;">👉 네이버 지도 바로가기</a></div>` 
                : '';
            const menuHtml = item.menu 
                ? `<div class="meta-row">🍴 <b>추천:</b> ${item.menu}</div>` 
                : '';

            return `
                <div class="info-card" id="card_${item.id}">
                    <h4>
                        <span>${item.name}</span>
                        <span class="category-badge">${item.category || '기타'}</span>
                    </h4>
                    <div class="meta-row">📍 ${item.address}</div>
                    ${menuHtml}
                    ${linkHtml}

                    <div class="rating-summary" id="rating_summary_${item.id}">
                        ⭐ 리뷰 로딩 중...
                    </div>

                    <hr>

                    <div style="font-weight:bold; font-size:12px; margin-bottom:6px;">💬 방문자 리뷰 & 별점</div>
                    <div class="reviews-container" id="reviews_list_${item.id}">
                        <div style="color:#888; font-size:11px; text-align:center; padding:10px;">리뷰를 불러오는 중입니다...</div>
                    </div>

                    <!-- 리뷰 작성 폼 -->
                    <div class="review-form">
                        <div class="form-row">
                            <select id="rev_rating_${item.id}">
                                <option value="5">⭐⭐⭐⭐⭐ 5점</option>
                                <option value="4">⭐⭐⭐⭐ 4점</option>
                                <option value="3">⭐⭐⭐ 3점</option>
                                <option value="2">⭐⭐ 2점</option>
                                <option value="1">⭐ 1점</option>
                            </select>
                            <input type="text" id="rev_comment_${item.id}" placeholder="한줄평 (예: 최고예요!)" onkeydown="if(event.key==='Enter') submitReview('${item.id}')">
                        </div>
                        <button type="button" onclick="submitReview('${item.id}')">별점 및 리뷰 등록</button>
                    </div>
                </div>
            `;
        }

        // ==========================================
        // ⭐ 9. 리뷰 로드 (Supabase + LocalStorage)
        // ==========================================
        async function loadReviewsForRestaurant(restaurantId) {
            const listEl = document.getElementById(`reviews_list_${restaurantId}`);
            const summaryEl = document.getElementById(`rating_summary_${restaurantId}`);
            if (!listEl) return;

            let reviews = [];

            // 1) Supabase에서 리뷰 조회
            if (supabaseClient && typeof restaurantId === 'number') {
                try {
                    const { data, error } = await supabaseClient
                        .from('reviews')
                        .select('*')
                        .eq('restaurant_id', restaurantId)
                        .order('created_at', { ascending: false });

                    if (!error && data) {
                        reviews = reviews.concat(data);
                    }
                } catch (e) {
                    console.warn('Supabase 리뷰 로드 건너뜀:', e);
                }
            }

            // 2) LocalStorage 리뷰 병합
            const localReviews = getReviewsFromLocalStorage(restaurantId);
            reviews = reviews.concat(localReviews);

            if (reviews.length === 0) {
                listEl.innerHTML = '<div style="color:#999; font-size:11px; text-align:center; padding:12px;">아직 작성된 리뷰가 없습니다.<br>첫 번째 리뷰를 남겨보세요! ✨</div>';
                if (summaryEl) summaryEl.innerHTML = '⭐ 첫 리뷰를 남겨주세요!';
                return;
            }

            // 평균 평점 계산
            const sum = reviews.reduce((acc, cur) => acc + (Number(cur.rating) || 0), 0);
            const avg = (sum / reviews.length).toFixed(1);
            if (summaryEl) {
                summaryEl.innerHTML = `⭐ <b>${avg}</b> / 5.0 (${reviews.length}개 리뷰)`;
            }

            // 리뷰 목록 표시
            let html = '';
            reviews.forEach(rev => {
                const stars = '⭐'.repeat(Math.min(5, Math.max(1, Number(rev.rating) || 5)));
                const dateStr = rev.created_at ? new Date(rev.created_at).toLocaleDateString('ko-KR') : '';
                html += `
                    <div class="review-item">
                        <div class="review-top">
                            <span>${stars} (${rev.rating}점)</span>
                            <span class="review-date">${dateStr}</span>
                        </div>
                        <div class="review-comment">${escapeHtml(rev.comment || '')}</div>
                    </div>
                `;
            });
            listEl.innerHTML = html;
        }

        // ==========================================
        // ✍️ 10. 리뷰 등록 (Supabase + LocalStorage)
        // ==========================================
        async function submitReview(restaurantId) {
            const ratingSelect = document.getElementById(`rev_rating_${restaurantId}`);
            const commentInput = document.getElementById(`rev_comment_${restaurantId}`);

            const rating = parseInt(ratingSelect.value, 10);
            const comment = commentInput.value.trim();

            if (!comment) {
                alert('리뷰 한줄평을 입력해 주세요!');
                commentInput.focus();
                return;
            }

            const newReview = {
                restaurant_id: typeof restaurantId === 'number' ? restaurantId : null,
                rating: rating,
                comment: comment,
                created_at: new Date().toISOString()
            };

            // 1) Supabase INSERT 시도 (스키마 자동 적응)
            if (supabaseClient && typeof restaurantId === 'number') {
                const res = await insertWithSchemaFallback('reviews', {
                    restaurant_id: restaurantId,
                    rating: rating,
                    comment: comment
                });
                if (res.error) {
                    console.warn('Supabase 리뷰 저장 건너뜀 (로컬 보관):', res.error.message);
                }
            }

            // 2) LocalStorage 영구 보관
            saveReviewToLocalStorage(restaurantId, newReview);

            commentInput.value = '';
            // 즉시 화면 갱신
            await loadReviewsForRestaurant(restaurantId);
        }

        // ==========================================
        // 🎯 11. 카테고리 필터링
        // ==========================================
        function filterCategory(category) {
            document.querySelectorAll('.filter-btn').forEach(btn => {
                if (btn.innerText.includes(category) || (category === '전체' && btn.innerText.includes('전체'))) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            markersList.forEach(item => {
                if (category === '전체' || item.category === category) {
                    item.marker.setMap(map);
                } else {
                    item.marker.setMap(null);
                    if (currentOpenInfoWindow === item.infoWindow) {
                        item.infoWindow.close();
                    }
                }
            });
        }

        // ==========================================
        // 🗄️ 12. LocalStorage 유틸리티 (데이터 영구 유지 보장)
        // ==========================================
        function getRestaurantsFromLocalStorage() {
            try {
                return JSON.parse(localStorage.getItem('matitkhuman_restaurants') || '[]');
            } catch (e) { return []; }
        }

        function saveRestaurantToLocalStorage(item) {
            try {
                const list = getRestaurantsFromLocalStorage();
                list.unshift(item);
                localStorage.setItem('matitkhuman_restaurants', JSON.stringify(list));
            } catch (e) {}
        }

        function getReviewsFromLocalStorage(restaurantId) {
            try {
                const all = JSON.parse(localStorage.getItem('matitkhuman_reviews') || '{}');
                return all[restaurantId] || [];
            } catch (e) { return []; }
        }

        function saveReviewToLocalStorage(restaurantId, review) {
            try {
                const all = JSON.parse(localStorage.getItem('matitkhuman_reviews') || '{}');
                if (!all[restaurantId]) all[restaurantId] = [];
                all[restaurantId].unshift(review);
                localStorage.setItem('matitkhuman_reviews', JSON.stringify(all));
            } catch (e) {}
        }

        function escapeHtml(str) {
            return str
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }
    </script>
